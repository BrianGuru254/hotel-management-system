spring:
  application:
    name: hrms

  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://db.wbiznfwaazzcdjsluvvp.supabase.co:5432/postgres?sslmode=require&currentSchema=${DATABASE_SCHEMA:public}}"
    username: "${DATABASE_USERNAME:postgres}"
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:public}

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:public}
    schemas:
      - ${DATABASE_SCHEMA:public}
    validate-on-migrate: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${HMS_JWT_SECRET}
      issuer: ${HMS_JWT_ISSUER:hotel-management-system}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      cookie-secure: ${HMS_REFRESH_COOKIE_SECURE:true}
    bootstrap-secret: ${HMS_BOOTSTRAP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
