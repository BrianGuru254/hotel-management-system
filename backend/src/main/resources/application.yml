spring:
  application:
    name: hrms

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/hrms
    username: hrms
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${HMS_JWT_SECRET}
      issuer: ${HMS_JWT_ISSUER:hotel-management-system}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
      cookie-secure: ${HMS_REFRESH_COOKIE_SECURE:true}
    bootstrap-secret: ${HMS_BOOTSTRAP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
